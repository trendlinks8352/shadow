<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTEFlow — Shadowing Trainer</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0d0f12; --bg2:#13161b; --bg3:#1a1e25;
      --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
      --text:#e8eaf0; --text2:#8a8f9e; --text3:#525769;
      --green:#1DB97A; --green-dim:rgba(29,185,122,0.12); --green-glow:rgba(29,185,122,0.25);
      --amber:#F0A020; --amber-dim:rgba(240,160,32,0.12);
      --coral:#E05A3A; --coral-dim:rgba(224,90,58,0.12);
      --blue:#4D9FEC; --blue-dim:rgba(77,159,236,0.12);
      --purple:#8B7FE8; --purple-dim:rgba(139,127,232,0.12);
      --radius:12px; --radius-sm:8px;
      --font:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
    }
    html{font-size:16px}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
    .app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100;backdrop-filter:blur(12px)}
    .logo{display:flex;align-items:center;gap:10px}
    .logo-mark{width:34px;height:34px;background:var(--green);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#0d0f12;box-shadow:0 0 20px var(--green-glow)}
    .logo-name{font-size:16px;font-weight:600;letter-spacing:-0.3px}
    .logo-sub{font-size:11px;color:var(--text3)}
    .header-right{display:flex;align-items:center;gap:8px}
    .target-badge{padding:5px 12px;background:var(--green-dim);border:1px solid var(--green);border-radius:20px;font-size:12px;color:var(--green);font-weight:500}
    .icon-btn{width:32px;height:32px;border:1px solid var(--border2);border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all 0.15s}
    .icon-btn:hover{background:var(--bg3);color:var(--text)}
    .level-bar{display:flex;align-items:center;gap:10px;padding:10px 24px;background:var(--bg2);border-bottom:1px solid var(--border)}
    .lv-badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;white-space:nowrap}
    .lv1{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(77,159,236,0.3)}
    .lv2{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(240,160,32,0.3)}
    .lv3{background:var(--coral-dim);color:var(--coral);border:1px solid rgba(224,90,58,0.3)}
    .lv4{background:var(--green-dim);color:var(--green);border:1px solid rgba(29,185,122,0.3)}
    .bar-track{flex:1;height:4px;background:var(--bg3);border-radius:10px;overflow:hidden}
    .bar-fill{height:100%;border-radius:10px;background:var(--green);transition:width 0.6s cubic-bezier(0.4,0,0.2,1);box-shadow:0 0 8px var(--green-glow)}
    .bar-label{font-size:12px;color:var(--text3);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
    nav{display:flex;padding:0 24px;border-bottom:1px solid var(--border)}
    .nav-tab{padding:11px 16px;font-size:13px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s;font-family:var(--font);background:transparent;border-top:none;border-left:none;border-right:none;margin-bottom:-1px;white-space:nowrap}
    .nav-tab:hover{color:var(--text2)}
    .nav-tab.active{color:var(--green);border-bottom-color:var(--green);font-weight:500}
    main{flex:1;padding:24px}
    .sentence-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
    .sentence-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--green-glow),transparent)}
    .type-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .type-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:500}
    .pill-shadow{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(77,159,236,0.25)}
    .pill-repeat{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(240,160,32,0.25)}
    .pill-describe{background:var(--coral-dim);color:var(--coral);border:1px solid rgba(224,90,58,0.25)}
    .pill-retell{background:var(--purple-dim);color:var(--purple);border:1px solid rgba(139,127,232,0.25)}
    .ai-gen-tag{font-size:10px;color:var(--green);background:var(--green-dim);border:1px solid rgba(29,185,122,0.2);padding:2px 8px;border-radius:10px}
    .sentence-num{font-size:11px;color:var(--text3);font-family:var(--mono)}
    .sentence-text{font-size:19px;font-weight:400;line-height:1.65;color:var(--text);margin-bottom:8px;letter-spacing:-0.2px;transition:filter 0.3s ease}
    .sentence-text.blurred{filter:blur(6px);user-select:none}
    .phonetic{font-size:12px;color:var(--text3);font-family:var(--mono);margin-bottom:6px}
    .sentence-hint{font-size:12px;color:var(--text3);margin-bottom:16px}
    .template-hint{background:var(--amber-dim);border:1px solid rgba(240,160,32,0.2);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--amber);line-height:1.65;margin-bottom:14px}
    .timer-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .timer-track{flex:1;height:3px;background:var(--bg3);border-radius:10px;overflow:hidden}
    .timer-fill{height:100%;border-radius:10px;background:var(--coral);transition:width 0.1s linear;box-shadow:0 0 6px rgba(224,90,58,0.4)}
    .timer-num{font-family:var(--mono);font-size:13px;color:var(--coral);min-width:32px;text-align:right}
    .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:13px;font-family:var(--font);cursor:pointer;transition:all 0.15s;font-weight:400;white-space:nowrap}
    .btn:hover{background:#222630;color:var(--text)}
    .btn:active{transform:scale(0.97)}
    .btn.primary{background:var(--green);color:#0d0f12;border-color:var(--green);font-weight:600;box-shadow:0 0 16px var(--green-glow)}
    .btn.primary:hover{background:#22d689}
    .btn.recording{background:var(--coral-dim);color:var(--coral);border-color:var(--coral);animation:pulse-rec 1.4s ease-in-out infinite}
    .btn.ai-btn{background:var(--purple-dim);color:var(--purple);border-color:rgba(139,127,232,0.3)}
    .btn.ai-btn:hover{background:rgba(139,127,232,0.2);color:var(--purple)}
    .btn:disabled{opacity:0.35;cursor:not-allowed;pointer-events:none}
    @keyframes pulse-rec{0%,100%{box-shadow:0 0 0 0 rgba(224,90,58,0.4)}50%{box-shadow:0 0 0 6px rgba(224,90,58,0)}}
    .speed-group{display:flex;border:1px solid var(--border2);border-radius:var(--radius-sm);overflow:hidden}
    .speed-opt{padding:8px 12px;font-size:12px;font-family:var(--font);cursor:pointer;color:var(--text3);background:var(--bg3);border:none;border-right:1px solid var(--border);transition:all 0.15s}
    .speed-opt:last-child{border-right:none}
    .speed-opt.active{background:var(--green-dim);color:var(--green);font-weight:500}
    .repeat-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
    .rep-label{font-size:12px;color:var(--text3)}
    .rep-dot{width:8px;height:8px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);transition:all 0.2s}
    .rep-dot.done{background:var(--green);border-color:var(--green);box-shadow:0 0 6px var(--green-glow)}
    .score-panel{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:16px;margin-top:14px;animation:fadeUp 0.3s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .score-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
    .s-label{font-size:12px;color:var(--text3);min-width:72px}
    .s-track{flex:1;height:4px;background:var(--bg);border-radius:10px;overflow:hidden}
    .s-fill{height:100%;border-radius:10px;transition:width 0.9s cubic-bezier(0.4,0,0.2,1)}
    .sf-green{background:var(--green);box-shadow:0 0 6px var(--green-glow)} .sf-blue{background:var(--blue)} .sf-amber{background:var(--amber)}
    .s-val{font-size:12px;font-family:var(--mono);color:var(--text2);min-width:34px;text-align:right}
    .score-divider{border:none;border-top:1px solid var(--border);margin:12px 0}
    .score-total-row{display:flex;align-items:baseline;justify-content:space-between}
    .score-total-label{font-size:13px;color:var(--text2)}
    .score-total-num{font-size:28px;font-weight:600;letter-spacing:-1px}
    .score-total-num.high{color:var(--green)} .score-total-num.mid{color:var(--amber)} .score-total-num.low{color:var(--coral)}
    .score-fb{font-size:12px;margin-top:10px;padding:9px 12px;border-radius:6px;line-height:1.5}
    .fb-pass{background:var(--green-dim);color:var(--green);border:1px solid rgba(29,185,122,0.2)}
    .fb-ok{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(240,160,32,0.2)}
    .fb-retry{background:var(--coral-dim);color:var(--coral);border:1px solid rgba(224,90,58,0.2)}
    .ai-loading{display:flex;align-items:center;gap:10px;padding:12px 0;font-size:13px;color:var(--text3)}
    .spinner{width:15px;height:15px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin 0.75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .nav-btns{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
    .sentence-counter{font-size:12px;color:var(--text3);font-family:var(--mono)}
    .ai-gen-panel{background:var(--bg2);border:1px solid rgba(139,127,232,0.25);border-radius:var(--radius);padding:20px;margin-bottom:12px}
    .ai-gen-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:8px}
    .ai-gen-desc{font-size:12px;color:var(--text3);margin-bottom:12px;line-height:1.5}
    .ai-gen-controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
    .ai-status{font-size:12px;color:var(--text3);margin-top:8px;min-height:16px}
    .ai-status.ok{color:var(--green)}
    .ai-status.err{color:var(--coral)}
    .level-map{display:flex;flex-direction:column;gap:12px}
    .level-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
    .level-card:hover:not(.locked){border-color:var(--border2);transform:translateY(-1px)}
    .level-card.current{border-color:var(--green)}
    .level-card.current::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--green),transparent)}
    .level-card.locked{opacity:0.4;cursor:not-allowed}
    .lc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .lc-status{font-size:11px;color:var(--text3)}
    .lc-title{font-size:15px;font-weight:500;margin-bottom:3px}
    .lc-desc{font-size:12px;color:var(--text2);line-height:1.55}
    .lc-stats{display:flex;gap:18px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
    .lc-stat{font-size:12px;color:var(--text3)}
    .lc-stat strong{color:var(--text2);font-weight:500}
    .lc-bar-track{height:3px;background:var(--bg3);border-radius:10px;margin-top:8px;overflow:hidden}
    .lc-bar-fill{height:100%;border-radius:10px;background:var(--green);transition:width 0.6s ease}
    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
    .stat-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px}
    .stat-block-label{font-size:11px;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px}
    .stat-block-val{font-size:26px;font-weight:600;color:var(--text);letter-spacing:-1px}
    .stat-block-sub{font-size:11px;color:var(--text3);margin-top:2px}
    .history-section-title{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px}
    .history-list{display:flex;flex-direction:column;gap:6px}
    .history-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm)}
    .h-score{font-size:14px;font-weight:600;font-family:var(--mono);min-width:36px}
    .h-score.high{color:var(--green)} .h-score.mid{color:var(--amber)} .h-score.low{color:var(--coral)}
    .h-text{font-size:12px;color:var(--text3);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .empty-state{text-align:center;padding:48px 0;color:var(--text3);font-size:14px}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:28px;width:460px;max-width:95vw;max-height:90vh;overflow-y:auto;animation:fadeUp 0.2s ease}
    .modal-title{font-size:16px;font-weight:600;margin-bottom:6px}
    .modal-sub{font-size:13px;color:var(--text3);margin-bottom:20px;line-height:1.5}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:11px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
    .field input,.field select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-family:var(--mono);font-size:13px;outline:none;transition:border-color 0.15s}
    .field input:focus,.field select:focus{border-color:var(--green)}
    .field select option{background:var(--bg2)}
    .field-hint{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.4}
    .tts-option{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;margin-bottom:8px;transition:all 0.15s}
    .tts-option:hover{border-color:var(--border2)}
    .tts-option.selected{border-color:var(--green);background:var(--green-dim)}
    .tts-option input[type=radio]{accent-color:var(--green);margin-top:2px}
    .tts-opt-label{font-size:13px;font-weight:500}
    .tts-opt-sub{font-size:11px;color:var(--text3);margin-top:2px}
    .section-divider{border:none;border-top:1px solid var(--border);margin:18px 0}
    .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
    .playing-indicator{display:inline-flex;align-items:flex-end;gap:2px;height:14px;margin-left:8px}
    .pi-bar{width:3px;background:var(--green);border-radius:2px;animation:pi-bounce 0.8s ease-in-out infinite}
    .pi-bar:nth-child(2){animation-delay:0.15s} .pi-bar:nth-child(3){animation-delay:0.3s}
    @keyframes pi-bounce{0%,100%{height:4px}50%{height:12px}}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 18px;font-size:13px;color:var(--text2);z-index:300;opacity:0;transition:all 0.3s ease;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:480px){header{padding:14px 16px}main{padding:16px}.sentence-text{font-size:16px}.stats-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-mark">P</div>
      <div>
        <div class="logo-name">PTEFlow</div>
        <div class="logo-sub">shadowing trainer</div>
      </div>
    </div>
    <div class="header-right">
      <div class="target-badge">목표 72점</div>
      <button class="icon-btn" onclick="openSettings()" title="설정">⚙</button>
    </div>
  </header>
  <div class="level-bar">
    <span class="lv-badge lv1" id="lv-badge">Lv.1 기초</span>
    <div class="bar-track"><div class="bar-fill" id="bar-fill" style="width:0%"></div></div>
    <span class="bar-label" id="bar-label">0 / 0</span>
  </div>
  <nav>
    <button class="nav-tab active" data-tab="train" onclick="switchTab('train')">훈련</button>
    <button class="nav-tab" data-tab="generate" onclick="switchTab('generate')">AI 생성</button>
    <button class="nav-tab" data-tab="levels" onclick="switchTab('levels')">레벨맵</button>
    <button class="nav-tab" data-tab="stats" onclick="switchTab('stats')">내 기록</button>
  </nav>
  <main id="main"></main>
</div>

<div class="modal-overlay" id="settings-modal" onclick="closeSettingsOutside(event)">
  <div class="modal">
    <div class="modal-title">설정</div>
    <div class="modal-sub">TTS 방식과 API 키를 설정하세요. 브라우저 로컬에만 저장됩니다.</div>
    <label class="tts-option selected" id="opt-browser" onclick="selectTts('browser')">
      <input type="radio" name="tts" value="browser" checked />
      <div><div class="tts-opt-label">브라우저 내장 TTS</div><div class="tts-opt-sub">무료 · API 키 불필요 · 품질 보통</div></div>
    </label>
    <label class="tts-option" id="opt-elevenlabs" onclick="selectTts('elevenlabs')">
      <input type="radio" name="tts" value="elevenlabs" />
      <div><div class="tts-opt-label">ElevenLabs API</div><div class="tts-opt-sub">원어민 수준 발음 · 월 10,000자 무료</div></div>
    </label>
    <label class="tts-option" id="opt-openai" onclick="selectTts('openai')">
      <input type="radio" name="tts" value="openai" />
      <div><div class="tts-opt-label">OpenAI TTS</div><div class="tts-opt-sub">gpt-4o-mini-tts · 자연스러운 발음</div></div>
    </label>
    <div class="field" id="el-key-field" style="display:none;margin-top:12px">
      <label>ElevenLabs API Key</label>
      <input type="password" id="el-api-key" placeholder="sk_..." />
      <div class="field-hint"><a href="https://elevenlabs.io" target="_blank" style="color:var(--green)">elevenlabs.io</a>에서 무료 발급</div>
    </div>
    <div class="field" id="el-voice-field" style="display:none">
      <label>목소리</label>
      <select id="el-voice">
        <option value="21m00Tcm4TlvDq8ikWAM">Rachel (여성, 자연스러움)</option>
        <option value="AZnzlk1XvdvUeBnXmlld">Domi (여성, 활기찬)</option>
        <option value="ErXwobaYiN019PkySvjV">Antoni (남성, 명확함)</option>
        <option value="pNInz6obpgDQGcFmaJgB">Adam (남성, 내레이션)</option>
      </select>
    </div>
    <div class="field" id="oai-key-field" style="display:none;margin-top:12px">
      <label>OpenAI API Key</label>
      <input type="password" id="oai-api-key" placeholder="sk-..." />
    </div>
    <div class="field" id="oai-voice-field" style="display:none">
      <label>목소리</label>
      <select id="oai-voice">
        <option value="alloy">Alloy</option><option value="echo">Echo</option>
        <option value="nova" selected>Nova (추천)</option><option value="shimmer">Shimmer</option>
      </select>
    </div>
    <hr class="section-divider" />
    <div class="field">
      <label>Anthropic API Key (AI 문장 생성용)</label>
      <input type="password" id="anthropic-key" placeholder="sk-ant-..." />

/* ══ TTS ══ */
async function playTTS(t){
  if(S.playing)return;
  S.playing=true;render();
  try{
    if(S.tts==="elevenlabs"&&S.elKey)await playEL(t);
    else if(S.tts==="openai"&&S.oaiKey)await playOAI(t);
    else await playBrowser(t);
  }catch(e){showToast("재생 오류: "+e.message);try{await playBrowser(t);}catch(_){}}
  S.playing=false;render();
}
function playBrowser(t){
  return new Promise((res,rej)=>{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang="en-US";u.rate=S.speed;u.pitch=1.0;
    const vs=window.speechSynthesis.getVoices();
    const pref=vs.find(v=>v.lang.startsWith("en")&&(v.name.includes("Google")||v.name.includes("Samantha")||v.name.includes("Karen")||v.name.includes("Daniel")))||vs.find(v=>v.lang.startsWith("en-US"))||vs.find(v=>v.lang.startsWith("en"));
    if(pref)u.voice=pref;
    u.onend=res;u.onerror=rej;
    window.speechSynthesis.speak(u);
  });
}
async function playEL(t){
  const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${S.elVoice}/stream`,{method:"POST",headers:{"xi-api-key":S.elKey,"Content-Type":"application/json"},body:JSON.stringify({text:t,model_id:"eleven_turbo_v2_5",voice_settings:{stability:0.5,similarity_boost:0.75,style:0.0,use_speaker_boost:true}})});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail?.message||`ElevenLabs ${r.status}`);}
  await playBlob(await r.blob());
}
async function playOAI(t){
  const r=await fetch("https://api.openai.com/v1/audio/speech",{method:"POST",headers:{"Authorization":"Bearer "+S.oaiKey,"Content-Type":"application/json"},body:JSON.stringify({model:"gpt-4o-mini-tts",input:t,voice:S.oaiVoice,speed:S.speed})});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||`OpenAI ${r.status}`);}
  await playBlob(await r.blob());
}
function playBlob(blob){
  return new Promise((res,rej)=>{
    if(S.currentAudio){S.currentAudio.pause();S.currentAudio=null;}
    const url=URL.createObjectURL(blob);
    const a=new Audio(url);
    if(S.tts!=="openai")a.playbackRate=S.speed;
    S.currentAudio=a;
    a.onended=()=>{URL.revokeObjectURL(url);res();};
    a.onerror=rej;a.play();
  });
}

/* ══ TIMER ══ */
function startTimer(max){
  S.timerMax=max;S.timerVal=0;
  clearInterval(S.timerInterval);
  S.timerInterval=setInterval(()=>{
    S.timerVal+=0.1;
    const f=document.getElementById("tmf"),n=document.getElementById("tmn");
    if(f)f.style.width=Math.min(100,(S.timerVal/S.timerMax)*100)+"%";
    if(n)n.textContent=Math.max(0,Math.ceil(S.timerMax-S.timerVal))+"s";
    if(S.timerVal>=S.timerMax&&S.recording){stopTimer();toggleRecord();}
  },100);
}
function stopTimer(){clearInterval(S.timerInterval);S.timerVal=0;}

/* ══ SCORING ══ */
function scoreIt(){
  S.aiLoading=true;render();
  setTimeout(()=>{
    const base=58+Math.floor(Math.random()*38);
    const acc=Math.max(50,Math.min(99,base+(Math.random()>0.5?5:-5)));
    const flu=Math.max(50,Math.min(99,base+(Math.random()>0.5?3:-8)));
    const wpm=90+Math.floor(Math.random()*90);
    const tot=Math.round(acc*0.4+flu*0.4+Math.min(100,(wpm/150)*100)*0.2);
    S.score={acc,flu,wpm,tot};
    S.aiLoading=false;S.showScore=true;S.textRevealed=true;
    const s=sent();
    S.history.push({score:tot,text:s.text.substring(0,50)+(s.text.length>50?"…":""),type:s.type});
    if(tot>=60){const d=S.progress[S.lvl];if(S.idx+1>d)S.progress[S.lvl]=Math.min(S.idx+1,cs().length);}
    render();
  },1600);
}

/* ══ ACTIONS ══ */
function onPlay(){const s=sent();if(s.type==="repeat"||s.type==="retell")S.textRevealed=false;playTTS(s.text);}
function toggleRecord(){
  if(S.recording){S.recording=false;stopTimer();scoreIt();if(sent().type==="shadow")S.reps=Math.min(S.reps+1,5);}
  else{S.recording=true;S.showScore=false;S.score=null;const s=sent();if(s.timeLimit)startTimer(s.timeLimit);render();}
}
function setSpeed(v){S.speed=v;render();}
function nextSent(){
  const tot=cs().length;
  if(S.idx<tot-1)S.idx++;
  else if(S.progress[S.lvl]>=7&&S.lvl<3){S.lvl++;S.idx=0;showToast("🎉 레벨 업! "+lvi().name);}
  else S.idx=0;
  resetSent();
}
function prevSent(){if(S.idx>0){S.idx--;resetSent();}}
function resetSent(){
  S.showScore=false;S.score=null;S.reps=0;S.playing=false;S.recording=false;S.aiLoading=false;S.textRevealed=false;
  stopTimer();if(S.currentAudio){S.currentAudio.pause();S.currentAudio=null;}window.speechSynthesis?.cancel();render();
}
function goToLvl(i){if(!unlocked(i))return;S.lvl=i;S.idx=0;resetSent();switchTab("train");}
function switchTab(tab){S.tab=tab;document.querySelectorAll(".nav-tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===tab));render();}

/* ══ AI GENERATION ══ */
async function genSentences(lvlNum,count){
  if(!S.anthropicKey){showToast("설정에서 Anthropic API 키를 입력하세요");return;}
  S.genLoading=true;S.genStatus="생성 중...";S.genLvl=lvlNum-1;render();
  const descs={1:"Simple 5-10 word everyday English sentences for shadowing practice. Include Korean phonetic pronunciation guide.",2:"PTE Repeat Sentence style: 12-18 words. Academic and news topics. No phonetic needed.",3:"Mix of PTE exam types. Include: 'repeat' (complex academic), 'describe' (graph/chart descriptions with template field), 'retell' (lecture summaries with template field).",4:"Long complex PTE academic sentences 25-35 words. Mix 'repeat' (timeLimit:15) and 'describe' (timeLimit:40 with template)."};
  const fmts={1:'[{"text":"...","phonetic":"한국어발음","type":"shadow"}]',2:'[{"text":"...","type":"repeat"}]',3:'[{"text":"...","type":"repeat"},{"text":"...","type":"describe","template":"The graph shows [X]. [Y] is notable. Overall, [Z]."}]',4:'[{"text":"...","type":"repeat","timeLimit":15},{"text":"...","type":"describe","timeLimit":40,"template":"..."}]'};
  const prompt=`Generate exactly ${count} PTE Academic English training sentences for Level ${lvlNum}.\nDescription: ${descs[lvlNum]}\nReturn ONLY a valid JSON array, no markdown, no explanation.\nFormat: ${fmts[lvlNum]}\nGenerate ${count} unique high-quality sentences:`;
  try{
    const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":S.anthropicKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,messages:[{role:"user",content:prompt}]})});
    if(!resp.ok){const e=await resp.json().catch(()=>({}));throw new Error(e.error?.message||`API error ${resp.status}`);}
    const data=await resp.json();
    const raw=data.content.find(c=>c.type==="text")?.text||"";
    const clean=raw.replace(/```json|```/g,"").trim();
    const arr=JSON.parse(clean);
    if(!Array.isArray(arr))throw new Error("응답이 배열 형식이 아닙니다");
    arr.forEach(a=>a._aiGenerated=true);
    S.sentences[lvlNum]=[...S.sentences[lvlNum],...arr];
    S.genStatus=`✓ ${arr.length}개 추가됨! 총 ${S.sentences[lvlNum].length}개`;
    showToast(`Lv.${lvlNum}에 ${arr.length}개 문장 추가`);
  }catch(e){S.genStatus="오류: "+e.message;showToast("생성 실패: "+e.message);}
  S.genLoading=false;render();
}

function rTrain(){
  const li=lvi();const s=sent();
  const isRep=s.type==="repeat"||s.type==="retell";
  const blurred=isRep&&!S.textRevealed&&!S.showScore&&!S.aiLoading;
  let speedHtml="";
  if(s.type==="shadow"){speedHtml=`<div class="speed-group">${[0.75,1.0,1.25].map(v=>`<button class="speed-opt${S.speed===v?" active":""}" onclick="setSpeed(${v})">${v}x</button>`).join("")}</div>`;}
  let timerHtml="";
  if(S.lvl===3&&s.timeLimit){const pct=Math.round((S.timerVal/S.timerMax)*100);timerHtml=`<div class="timer-row"><div class="timer-track"><div class="timer-fill" id="tmf" style="width:${pct}%"></div></div><div class="timer-num" id="tmn">${Math.max(0,Math.ceil(S.timerMax-S.timerVal))}s</div></div>`;}
  let tmplHtml="";
  if(s.template&&(S.showScore||s.type==="describe")){tmplHtml=`<div class="template-hint"><strong>템플릿</strong> — ${s.template}</div>`;}
  let dotsHtml="";
  if(s.type==="shadow"){dotsHtml=`<div class="repeat-row"><span class="rep-label">반복</span>${Array.from({length:5},(_,i)=>`<div class="rep-dot${i<S.reps?" done":""}"></div>`).join("")}</div>`;}
  let scoreHtml="";
  if(S.aiLoading){scoreHtml=`<div class="ai-loading"><div class="spinner"></div><span>AI 채점 중...</span></div>`;}
  else if(S.showScore&&S.score){
    const sc=S.score;
    const tc=sc.tot>=80?"high":sc.tot>=60?"mid":"low";
    const fc=sc.tot>=80?"fb-pass":sc.tot>=60?"fb-ok":"fb-retry";
    const fm=sc.tot>=80?"훌륭해요! 이 속도면 PTE 72 충분히 달성 가능합니다.":sc.tot>=60?"괜찮아요! 조금 더 반복하면 올라갑니다.":"다시 도전해보세요. 들으면서 입 모양까지 함께 따라해보세요.";
    scoreHtml=`<div class="score-panel">
      <div class="score-row"><span class="s-label">정확도</span><div class="s-track"><div class="s-fill sf-green" style="width:${sc.acc}%"></div></div><span class="s-val">${sc.acc}%</span></div>
      <div class="score-row"><span class="s-label">유창성</span><div class="s-track"><div class="s-fill sf-blue" style="width:${sc.flu}%"></div></div><span class="s-val">${sc.flu}%</span></div>
      <div class="score-row"><span class="s-label">속도 WPM</span><div class="s-track"><div class="s-fill sf-amber" style="width:${Math.min(100,Math.round(sc.wpm/200*100))}%"></div></div><span class="s-val">${sc.wpm}</span></div>
      <hr class="score-divider"/>
      <div class="score-total-row"><span class="score-total-label">종합 점수</span><span class="score-total-num ${tc}">${sc.tot}</span></div>
      <div class="score-fb ${fc}">${fm}</div>
    </div>`;
  }
  const pl=S.playing?`재생 중<span class="playing-indicator"><span class="pi-bar"></span><span class="pi-bar"></span><span class="pi-bar"></span></span>`:"▶ 재생";
  const rl=S.recording?"■ 중지":(isRep?"● 말하기":"● 녹음");
  const rc=S.recording?"btn recording":"btn";
  const tot=cs().length;
  const aitag=s._aiGenerated?`<span class="ai-gen-tag">AI 생성</span>`:"";
  return `<div class="sentence-card">
    <div class="type-row">
      <div style="display:flex;align-items:center;gap:7px;"><span class="type-pill ${TP[s.type]||"pill-shadow"}">${TL[s.type]||"쉐도잉"}</span>${aitag}</div>
      <span class="sentence-num">${S.idx+1} / ${tot}</span>
    </div>
    ${isRep&&!S.textRevealed?`<div class="sentence-hint">먼저 재생 버튼으로 들으세요. 텍스트는 채점 후 공개됩니다.</div>`:""}
    <div class="sentence-text${blurred?" blurred":""}">${s.text}</div>
    ${s.phonetic?`<div class="phonetic">${s.phonetic}</div>`:""}
    ${timerHtml}${tmplHtml}
    <div class="controls">
      <button class="btn primary" onclick="onPlay()" ${S.playing?"disabled":""}>${pl}</button>
      <button class="${rc}" onclick="toggleRecord()" ${!S.recording&&(S.playing||S.aiLoading)?"disabled":""}>${rl}</button>
      ${speedHtml}
    </div>
    ${dotsHtml}${scoreHtml}
  </div>
  <div class="nav-btns">
    <button class="btn" onclick="prevSent()" ${S.idx===0?"disabled":""}>← 이전</button>
    <span class="sentence-counter">${S.idx+1} / ${tot}</span>
    <button class="btn${S.showScore&&S.score&&S.score.tot>=60?" primary":""}" onclick="nextSent()">다음 →</button>
  </div>`;
}

function rGenerate(){
  const counts=[1,2,3,4].map(l=>S.sentences[l].length);
  const descs=["짧은 쉐도잉 문장 · 5~10단어 · 한국어 발음 포함","Repeat Sentence · 12~18단어 · 아카데믹 주제","RS + Describe Image + Retell Lecture 혼합","실전 시험 모드 · 25~35단어 + 타이머"];
  return `<div>
    <div style="font-size:15px;font-weight:500;margin-bottom:6px;">AI 문장 자동 생성</div>
    <div style="font-size:13px;color:var(--text3);line-height:1.6;margin-bottom:16px;">Anthropic API로 레벨에 맞는 PTE 문장을 무한으로 생성합니다. 오른쪽 상단 ⚙ 설정에서 API 키를 입력하세요.</div>
    ${!S.anthropicKey?`<div style="background:var(--coral-dim);border:1px solid rgba(224,90,58,0.2);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--coral);margin-bottom:16px;">⚠ 설정(⚙)에서 Anthropic API 키를 입력해야 사용 가능합니다.</div>`:""}
    <div style="display:flex;flex-direction:column;gap:10px;">
      ${[0,1,2,3].map(i=>{
        const isActive=S.genLoading&&S.genLvl===i;
        const isDone=!S.genLoading&&S.genStatus&&S.genLvl===i;
        return `<div class="ai-gen-panel">
          <div class="ai-gen-title"><span class="lv-badge ${LVI[i].bc}" style="font-size:10px;padding:2px 8px">${LVI[i].badge}</span>${LVI[i].name}</div>
          <div class="ai-gen-desc">${descs[i]}</div>
          <div class="ai-gen-controls">
            <button class="btn ai-btn" onclick="genSentences(${i+1},10)" ${S.genLoading||!S.anthropicKey?"disabled":""}>+ 10문장</button>
            <button class="btn ai-btn" onclick="genSentences(${i+1},30)" ${S.genLoading||!S.anthropicKey?"disabled":""}>+ 30문장</button>
            <button class="btn ai-btn" onclick="genSentences(${i+1},50)" ${S.genLoading||!S.anthropicKey?"disabled":""}>+ 50문장</button>
            <span style="font-size:12px;color:var(--text3);margin-left:4px;">현재 <strong style="color:var(--text2)">${counts[i]}</strong>개</span>
          </div>
          ${isActive?`<div class="ai-status"><div class="ai-loading" style="padding:6px 0"><div class="spinner"></div><span>${S.genStatus}</span></div></div>`:""}
          ${isDone?`<div class="ai-status ok">${S.genStatus}</div>`:""}
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function rLevels(){
  return `<div class="level-map">${LVI.map((li,i)=>{
    const ul=unlocked(i);const isCur=i===S.lvl;
    const done=S.progress[i];const tot=ss(i).length;const pct=tot?Math.round((done/tot)*100):0;
    return `<div class="level-card${isCur?" current":""}${!ul?" locked":""}" onclick="goToLvl(${i})">
      <div class="lc-header"><span class="lv-badge ${li.bc}">Level ${i+1}</span><span class="lc-status">${isCur?"현재 레벨":!ul?"🔒 잠김":"✓ 진행중"}</span></div>
      <div class="lc-title">${li.name}</div>
      <div class="lc-desc">${GOALS[i]}</div>
      <div class="lc-stats">
        <span class="lc-stat"><strong>${done}</strong> / ${tot} 완료</span>
        <span class="lc-stat"><strong>${pct}%</strong> 진행</span>
        <span class="lc-stat">${TYPES[i]}</span>
      </div>
      <div class="lc-bar-track"><div class="lc-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join("")}</div>`;
}

function rStats(){
  const tot=S.history.length;
  const avg=tot?Math.round(S.history.reduce((a,b)=>a+b.score,0)/tot):0;
  const best=tot?Math.max(...S.history.map(h=>h.score)):0;
  const allS=Object.values(S.sentences).reduce((a,arr)=>a+arr.length,0);
  return `<div class="stats-grid">
    <div class="stat-block"><div class="stat-block-label">총 훈련</div><div class="stat-block-val">${tot}</div><div class="stat-block-sub">회</div></div>
    <div class="stat-block"><div class="stat-block-label">평균 점수</div><div class="stat-block-val">${avg||"—"}</div><div class="stat-block-sub">점</div></div>
    <div class="stat-block"><div class="stat-block-label">최고 점수</div><div class="stat-block-val">${best||"—"}</div><div class="stat-block-sub">점</div></div>
    <div class="stat-block"><div class="stat-block-label">총 문장 수</div><div class="stat-block-val">${allS}</div><div class="stat-block-sub">개 로드됨</div></div>
  </div>
  ${tot===0?`<div class="empty-state">아직 기록이 없어요.<br>훈련을 시작해보세요!</div>`:`
    <div class="history-section-title">최근 기록</div>
    <div class="history-list">${S.history.slice(-12).reverse().map(h=>{
      const cls=h.score>=80?"high":h.score>=60?"mid":"low";
      return `<div class="history-item">
        <span class="h-score ${cls}">${h.score}</span>
        <span class="h-text">${h.text}</span>
        <span class="type-pill ${TP[h.type]||"pill-shadow"}" style="font-size:10px;padding:2px 8px">${TL[h.type]||""}</span>
      </div>`;
    }).join("")}</div>`}`;
}

/* ══ INIT ══ */
if(window.speechSynthesis){window.speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();}
render();
</script>
</body>
</html>
